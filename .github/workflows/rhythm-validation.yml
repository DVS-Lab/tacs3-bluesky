name: Offline rhythm validation
on:
  pull_request:
    paths:
      - '.gitattributes'
      - 'code/**'
      - 'tests/**'
      - 'validation/**'
      - 'requirements-validation.txt'
      - '.github/workflows/rhythm-validation.yml'
  workflow_dispatch:
jobs:
  validation:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-validation.txt
      - run: python -m pip install -r requirements-validation.txt
      - run: python -m pytest tests -q
      - run: python code/validate_rhythms.py --subject 10034 --skip-legacy --output-name ci-smoke
      - run: python tests/check_pilot_smoke.py
